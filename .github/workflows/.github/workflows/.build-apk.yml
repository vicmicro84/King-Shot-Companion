
name: Build King Shot Companion APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q source/*.zip -d source || {
            echo "Project ZIP extraction failed"
            exit 1
          }

      - name: Find Gradle project
        id: project
        run: |
          FILE=$(find source -type f -name gradlew | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No Gradle wrapper found in ZIP"
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" \
            -type f -path '*/build/outputs/apk/debug/*.apk' \
            | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          mkdir -p release
          cp "$APK" release/KingShotCompanion-debug.apk

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: KingShotCompanion-APK
          path: release/KingShotCompanion-debug.apk
          if-no-files-found: error
